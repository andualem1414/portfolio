    <style>
      .tw { animation: tw 4s ease-in-out infinite; }
      .d1 { animation-delay: -1.3s } .d2 { animation-delay: -2.6s } .d3 { animation-delay: -3.4s }
      @keyframes tw { 0%,100% { opacity: .9 } 50% { opacity: .25 } }
      .drift { animation: drift 60s ease-in-out infinite alternate; }
      .drift2 { animation-duration: 80s; animation-delay: -30s; }
      @keyframes drift { from { transform: translateX(-30px) } to { transform: translateX(30px) } }
      @media (prefers-reduced-motion: reduce) { .tw, .drift { animation: none } }
    </style>
  </defs>
