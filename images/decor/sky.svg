<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="g" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#232a5a"/>
      <stop offset="0.6" stop-color="#1c2249"/>
      <stop offset="1" stop-color="#121633"/>
    </radialGradient>
    <filter id="fibre" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.009 0.45" numOctaves="2" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.62  0 0 0 0 0.66  0 0 0 0 0.9  0 0 0 2.2 -1.15"/>
    </filter>
    <filter id="fibre2" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.011 0.5" numOctaves="2" seed="3"/>
      <feColorMatrix values="0 0 0 0 0.05  0 0 0 0 0.06  0 0 0 0 0.16  0 0 0 2.4 -1.2"/>
    </filter>
    <radialGradient id="moonglow"><stop offset="0" stop-color="#f1c76a" stop-opacity=".22"/><stop offset=".45" stop-color="#f1c76a" stop-opacity=".07"/><stop offset="1" stop-color="#f1c76a" stop-opacity="0"/></radialGradient>
    <path id="spark" d="M0-7 L1.2-1.2 7 0 1.2 1.2 0 7-1.2 1.2-7 0-1.2-1.2Z"/>
    <style>
      .tw { animation: tw 4s ease-in-out infinite; }
      .d1 { animation-delay: -1.3s } .d2 { animation-delay: -2.6s } .d3 { animation-delay: -3.4s }
      @keyframes tw { 0%,100% { opacity: .9 } 50% { opacity: .25 } }
      @media (prefers-reduced-motion: reduce) { .tw { animation: none } }
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#g)"/>
  <g transform="rotate(-32 800 500)" opacity=".2"><rect x="-600" y="-600" width="2800" height="2200" filter="url(#fibre)"/></g>
  <g transform="rotate(24 800 500)" opacity=".35"><rect x="-600" y="-600" width="2800" height="2200" filter="url(#fibre2)"/></g>
  <g transform="rotate(-8 800 500)" opacity=".08"><rect x="-600" y="-600" width="2800" height="2200" filter="url(#fibre)"/></g>

  <!-- moon -->
  <g transform="translate(1290 170) rotate(-20)">
    <circle r="70" fill="url(#moonglow)"/>
    <mask id="cres"><circle r="23" fill="#fff"/><circle cx="10" cy="-7" r="20" fill="#000"/></mask>
    <g mask="url(#cres)"><circle r="22" fill="#f3d27e"/><circle r="21" fill="none" stroke="#fff3cf" stroke-width="1.2" stroke-dasharray="3 2"/></g>
  </g>

  <!-- stars -->
  <g fill="#e9e3ff">
    <use href="#spark" x="230" y="120" class="tw"/>
    <use href="#spark" x="1180" y="90" class="tw d2" transform="scale(1)"/>
    <use href="#spark" x="1460" y="330" class="tw d1"/>
    <use href="#spark" x="140" y="520" class="tw d3"/>
    <use href="#spark" x="1390" y="700" class="tw d2"/>
    <use href="#spark" x="330" y="840" class="tw d1"/>
    <use href="#spark" x="1080" y="260" class="tw d3" opacity=".6"/>
  </g>
  <g fill="#d8d3f2" opacity=".7">
    <circle cx="90" cy="60" r="1.6"/><circle cx="420" cy="70" r="1.2"/><circle cx="610" cy="40" r="1"/>
    <circle cx="980" cy="50" r="1.3"/><circle cx="1530" cy="90" r="1.5"/><circle cx="1340" cy="420" r="1.1"/>
    <circle cx="260" cy="330" r="1.4"/><circle cx="60" cy="760" r="1.2"/><circle cx="1560" cy="560" r="1.3"/>
    <circle cx="1230" cy="880" r="1.2"/><circle cx="480" cy="950" r="1"/><circle cx="1500" cy="940" r="1.4"/>
    <circle cx="180" cy="230" r="1" class="tw d1"/><circle cx="1420" cy="210" r="1.2" class="tw d3"/>
    <circle cx="350" cy="620" r="1.1" class="tw"/><circle cx="1260" cy="580" r="1" class="tw d2"/>
  </g>
</svg>
