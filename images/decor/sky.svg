      <stop offset="0" stop-color="#151a3d"/>
      <stop offset=".55" stop-color="#1d2350"/>
      <stop offset="1" stop-color="#262a58"/>
    </linearGradient>
    <radialGradient id="haze" cx="50%" cy="115%" r="70%">
      <stop offset="0" stop-color="#f2a65a" stop-opacity=".14"/>
      <stop offset=".5" stop-color="#b56a6a" stop-opacity=".05"/>
      <stop offset="1" stop-color="#b56a6a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonglow"><stop offset="0" stop-color="#f1c76a" stop-opacity=".22"/><stop offset=".45" stop-color="#f1c76a" stop-opacity=".07"/><stop offset="1" stop-color="#f1c76a" stop-opacity="0"/></radialGradient>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="4"/>
      <feColorMatrix values="0 0 0 0 .8  0 0 0 0 .82  0 0 0 0 1  0 0 0 .9 -.38"/>
    </filter>
    <mask id="cres"><circle r="23" fill="#fff"/><circle cx="10" cy="-7" r="20" fill="#000"/></mask>
    <path id="spark" d="M0-7 L1.2-1.2 7 0 1.2 1.2 0 7-1.2 1.2-7 0-1.2-1.2Z"/>
