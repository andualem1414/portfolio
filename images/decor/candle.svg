<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 170">
  <defs>
    <radialGradient id="glow"><stop offset="0" stop-color="#ffd27a" stop-opacity=".5"/><stop offset=".5" stop-color="#ffb347" stop-opacity=".12"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency=".06" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2"/></filter>
    <style>
      .fl { transform-origin: 90px 54px; animation: fl 1.8s ease-in-out infinite; }
      .gl { animation: gl 1.8s ease-in-out infinite; }
      @keyframes fl { 0%,100% { transform: scale(1, 1) rotate(0deg) } 30% { transform: scale(.94, 1.06) rotate(-3deg) } 60% { transform: scale(1.04, .95) rotate(2deg) } }
      @keyframes gl { 0%,100% { opacity: 1 } 40% { opacity: .75 } 70% { opacity: .9 } }
      @media (prefers-reduced-motion: reduce) { .fl, .gl { animation: none } }
    </style>
  </defs>
  <circle class="gl" cx="90" cy="40" r="44" fill="url(#glow)"/>
  <ellipse cx="90" cy="162" rx="80" ry="6" fill="#140a06" opacity=".45"/>
  <g filter="url(#r)">
    <!-- lower book -->
    <path d="M14 128 L168 128 L168 158 L14 158 Z" fill="#6b2a3a"/>
    <path d="M150 131 L166 131 L166 155 L150 155 Z" fill="#efe5cf"/>
    <path d="M152 136 L166 136 M152 141 L166 141 M152 146 L166 146 M152 151 L166 151" stroke="#c9bb9b" stroke-width=".8"/>
    <path d="M14 128 L168 128 L168 158 L14 158 Z" fill="none" stroke="#f0d9c0" stroke-width="1" stroke-dasharray="4 2.5" opacity=".8"/>
    <path d="M30 136 L120 136" stroke="#d9a441" stroke-width="1.5"/>
    <!-- upper book -->
    <path d="M26 104 L156 104 L156 128 L26 128 Z" fill="#2a6f78"/>
    <path d="M26 106 L40 106 L40 126 L26 126 Z" fill="#efe5cf"/>
    <path d="M28 111 L40 111 M28 116 L40 116 M28 121 L40 121" stroke="#c9bb9b" stroke-width=".8"/>
    <path d="M26 104 L156 104 L156 128 L26 128 Z" fill="none" stroke="#cdeee8" stroke-width="1" stroke-dasharray="4 2.5" opacity=".8"/>
    <path d="M60 112 L140 112 M60 120 L120 120" stroke="#d9a441" stroke-width="1.3"/>
    <!-- holder -->
    <ellipse cx="90" cy="102" rx="26" ry="5" fill="#d9a441"/>
    <path d="M70 100 C70 96 110 96 110 100 L106 103 L74 103 Z" fill="#b98228"/>
    <!-- candle -->
    <path d="M78 62 L102 62 L102 98 L78 98 Z" fill="#f2ead6"/>
    <path d="M78 62 C84 66 86 72 85 78" stroke="#ffffff" stroke-width="2" fill="none" opacity=".8"/>
    <path d="M78 62 L102 62 L102 98 L78 98 Z" fill="none" stroke="#fffaf0" stroke-width="1" stroke-dasharray="3 2"/>
    <path d="M90 62 L90 54" stroke="#3a2b24" stroke-width="1.6"/>
  </g>
  <g class="fl">
    <path d="M90 26 C96 36 99 44 96 50 C94 55 86 55 84 50 C81 44 84 36 90 26Z" fill="#ffc94a"/>
    <path d="M90 36 C93 42 94 46 92 49 C91 51 89 51 88 49 C86 46 87 42 90 36Z" fill="#fff4cc"/>
  </g>
</svg>
